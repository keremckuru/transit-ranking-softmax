name: Java CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile sources and tests
        run: javac -encoding UTF-8 -d out src/Main.java tests/MainTest.java
      - name: Run tests
        run: java -cp out MainTest
